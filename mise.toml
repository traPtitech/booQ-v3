[tools]
golangci-lint = "v2.14.0"

[tasks.gen-oapi]
description = "Generate OpenAPI client code"
run = "go generate ./internal/handler/openapi/generate.go"

[tasks.gen-mock]
description = "Generate gomock"
run = [
  "go generate ./internal/domain/mock_generate.go",
  "go generate ./internal/usecase/mock_generate.go",
]

[tasks.fmt]
description = "Format Code"
run = "go fmt ./..."

[tasks.lint]
description = "Run Lint"
run = ["go vet ./...", "golangci-lint run"]
